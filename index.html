<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071b35">

<title>Premier League Manager</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #071b35;
  color: white;
  font-family: Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

header {
  text-align: center;
  padding: 14px 8px 10px;
}

header h1 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 1.2px;
}

header p {
  margin: 5px 0 0;
  color: #afbdd0;
  font-size: 13px;
}

.app {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 7px;
  max-width: 510px;
  margin: auto;
  padding: 0 5px 18px;
}

/* BANE */

.pitch {
  position: relative;
  width: calc(100vw - 82px);
  max-width: 390px;
  height: 670px;
  border: 2px solid white;
  border-radius: 8px;
  overflow: hidden;
  background:
    repeating-linear-gradient(
      90deg,
      #168348 0,
      #168348 45px,
      #147842 45px,
      #147842 90px
    );
}

/* BANELINJER */

.halfway {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  border-top: 1.5px solid rgba(255,255,255,.7);
}

.circle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 82px;
  height: 82px;
  border: 1.5px solid rgba(255,255,255,.7);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.center-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.top-box,
.bottom-box {
  position: absolute;
  left: 23%;
  width: 54%;
  height: 71px;
  border: 1.5px solid rgba(255,255,255,.7);
}

.top-box { top: -1px; }
.bottom-box { bottom: -1px; }

/* KEMISTREGER */

.chemistry-lines {
  position: absolute;
  z-index: 1;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.chemistry-lines line {
  stroke: #f5f0df;
  stroke-width: 1.5;
  stroke-linecap: round;
  opacity: .95;
}

/* SPILLERKORT */

.player {
  position: absolute;
  z-index: 3;
  width: 78px;
  height: 71px;
  padding: 5px 3px;
  transform: translate(-50%, -50%);
  background: white;
  color: #071b35;
  border: 2px solid #071b35;
  border-radius: 7px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,.25);
  cursor: pointer;
}

.player:active {
  transform: translate(-50%, -50%) scale(.96);
}

.player-name {
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  line-height: 12px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.player-info {
  min-height: 25px;
  margin-top: 3px;
  padding-top: 3px;
  border-top: 1px solid #bcc5cf;
  color: #42546a;
  font-size: 8px;
  line-height: 10px;
}

/* KAPTAJN */

.captain {
  display: none;
  position: absolute;
  right: -7px;
  top: -8px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: #f2c94c;
  color: #071b35;
  font-size: 12px;
  line-height: 21px;
  font-weight: bold;
}

.player.is-captain .captain {
  display: block;
}

/* KEMIFELTER */

.chemistry {
  position: absolute;
  z-index: 4;
  width: 29px;
  height: 29px;
  transform: translate(-50%, -50%);
}

.chemistry input {
  width: 29px;
  height: 29px;
  padding: 0;
  border: 2px solid #071b35;
  border-radius: 50%;
  background: white;
  color: #071b35;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
  -webkit-appearance: none;
}

/* POINTTÆLLER */

.scoreboard {
  width: 66px;
  flex: 0 0 66px;
  margin-top: 12px;
  padding: 8px 5px;
  background: white;
  color: #071b35;
  border-radius: 8px;
  box-shadow: 0 2px 7px rgba(0,0,0,.3);
}

.scoreboard h3 {
  margin: 0 0 10px;
  text-align: center;
  font-size: 10px;
}

.score-section {
  margin-bottom: 13px;
  text-align: center;
}

.score-section label {
  display: block;
  min-height: 25px;
  margin-bottom: 4px;
  font-size: 8px;
  line-height: 10px;
  font-weight: bold;
}

.score-value {
  width: 100%;
  height: 34px;
  border: 2px solid #071b35;
  border-radius: 5px;
  background: #f2f4f7;
  color: #071b35;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.score-buttons {
  display: flex;
  gap: 3px;
  margin-top: 3px;
}

.score-buttons button {
  width: 50%;
  height: 27px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: #071b35;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.total-box {
  padding-top: 8px;
  border-top: 1px solid #aab4c0;
  text-align: center;
}

.total-box span {
  display: block;
  font-size: 9px;
  font-weight: bold;
}

.total-box strong {
  display: block;
  margin-top: 4px;
  font-size: 21px;
}

/* KNAPPER */

.bottom-buttons {
  display: flex;
  gap: 8px;
  max-width: 470px;
  margin: auto;
  padding: 0 9px 28px;
}

.bottom-buttons button {
  flex: 1;
  padding: 11px 5px;
  border: 1px solid #8292a5;
  border-radius: 7px;
  background: #163452;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

/* POPUP */

.modal {
  display: none;
  position: fixed;
  z-index: 20;
  inset: 0;
  padding: 15px;
  overflow-y: auto;
  background: rgba(0,0,0,.75);
}

.modal-content {
  width: 100%;
  max-width: 420px;
  margin: 12px auto;
  padding: 20px;
  border-radius: 12px;
  background: white;
  color: #071b35;
}

.modal-content h2 {
  margin: 0 0 3px;
  font-size: 22px;
}

.modal-help {
  margin: 0 0 12px;
  color: #64758a;
  font-size: 12px;
}

.modal-content label {
  display: block;
  margin-top: 10px;
  font-size: 11px;
  font-weight: bold;
}

.modal-content input[type="text"],
.modal-content input[type="number"] {
  width: 100%;
  margin-top: 3px;
  padding: 11px;
  border: 1px solid #aab4c0;
  border-radius: 6px;
  font-size: 16px;
}

.captain-choice {
  display: flex !important;
  align-items: center;
  gap: 9px;
  margin-top: 15px !important;
  padding: 10px;
  border-radius: 6px;
  background: #f1f3f6;
  font-size: 13px !important;
  font-weight: bold;
}

.captain-choice input {
  width: 21px;
  height: 21px;
}

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.modal-buttons button {
  width: 50%;
  padding: 13px 6px;
  border: 0;
  border-radius: 7px;
  font-weight: bold;
}

.cancel {
  background: #dfe3e8;
  color: #071b35;
}

.save {
  background: #071b35;
  color: white;
}

/* MOBIL */

@media (max-width: 370px) {
  .pitch {
    width: calc(100vw - 76px);
  }

  .scoreboard {
    width: 62px;
    flex-basis: 62px;
  }

  .player {
    width: 70px;
  }

  .player-name {
    font-size: 10px;
  }
}

/* COMPUTER */

@media (min-width: 700px) {
  header h1 {
    font-size: 22px;
  }

  .pitch {
    width: 390px;
  }
}
</style>
</head>

<script>

const STORAGE_KEY = "premierLeagueManager442V3";

let currentPlayer = null;

function emptyPlayer() {
  return {
    name: "",
    country: "",
    club: "",
    season: "",
    value: "",
    captain: false
  };
}

function createEmptyData() {
  return {
    players: Array.from({length:11}, emptyPlayer),
    chemistry: Array(15).fill(""),
    scores: {
      attack: 0,
      midfield: 0,
      defence: 0
    }
  };
}

let appData = createEmptyData();

function loadData() {

  const keys = [
    STORAGE_KEY,
    "premierLeagueManager442V2",
    "premierLeagueManager442"
  ];

  let saved = null;

  for (const key of keys) {
    const data = localStorage.getItem(key);

    if (data) {
      saved = data;
      break;
    }
  }

  if (saved) {

    try {

      const parsed = JSON.parse(saved);

      if (Array.isArray(parsed.players)) {

        appData.players = Array.from(
          {length:11},
          (_,i) => ({
            ...emptyPlayer(),
            ...(parsed.players[i] || {})
          })
        );

      }

      if (Array.isArray(parsed.chemistry)) {

        appData.chemistry = Array.from(
          {length:15},
          (_,i) => parsed.chemistry[i] || ""
        );

      }

      if (parsed.scores) {

        appData.scores = {
          attack: Number(parsed.scores.attack) || 0,
          midfield: Number(parsed.scores.midfield) || 0,
          defence: Number(parsed.scores.defence) || 0
        };

      }

    } catch(e) {
      console.log("Kunne ikke læse gemte data");
    }

  }

  persist();
  renderAll();
}

function renderAll() {

  document.querySelectorAll(".player").forEach(card => {

    const index = Number(card.dataset.player);
    const player = appData.players[index] || emptyPlayer();

    const nameField = card.querySelector(".player-name");
    const infoField = card.querySelector(".player-info");

    /* TOMT indtil brugeren selv skriver */

    nameField.textContent = player.name || "";

    const info = [
      player.country,
      player.club,
      player.season,
      player.value ? "Værdi " + player.value : ""
    ].filter(Boolean);

    infoField.textContent =
      info.length ? info.join(" · ") : "";

    card.classList.toggle(
      "is-captain",
      Boolean(player.captain)
    );

  });

  document.querySelectorAll(".chem-input").forEach(input => {

    const i = Number(input.dataset.chem);

    input.value =
      appData.chemistry[i] || "";

  });

  document.getElementById("attackScore").value =
    appData.scores.attack;

  document.getElementById("midfieldScore").value =
    appData.scores.midfield;

  document.getElementById("defenceScore").value =
    appData.scores.defence;

  updateTotal();
}

function openPlayer(index) {

  currentPlayer = index;

  const p = appData.players[index];

  playerName.value = p.name || "";
  playerCountry.value = p.country || "";
  playerClub.value = p.club || "";
  playerSeason.value = p.season || "";
  playerValue.value = p.value || "";
  playerCaptain.checked = Boolean(p.captain);

  playerModal.style.display = "block";

  setTimeout(() => playerName.focus(),100);
}

function closeModal() {

  playerModal.style.display = "none";
  currentPlayer = null;

}

function savePlayer() {

  if (currentPlayer === null) return;

  const captain =
    playerCaptain.checked;

  if (captain) {

    appData.players.forEach(p => {
      p.captain = false;
    });

  }

  appData.players[currentPlayer] = {

    name: playerName.value.trim(),
    country: playerCountry.value.trim(),
    club: playerClub.value.trim(),
    season: playerSeason.value.trim(),
    value: playerValue.value.trim(),
    captain: captain

  };

  persist();
  renderAll();
  closeModal();
}

function changeScore(id, amount) {

  const input =
    document.getElementById(id);

  input.value =
    (Number(input.value) || 0) + amount;

  readScores();
  persist();
  updateTotal();
}

function readScores() {

  appData.scores.attack =
    Number(attackScore.value) || 0;

  appData.scores.midfield =
    Number(midfieldScore.value) || 0;

  appData.scores.defence =
    Number(defenceScore.value) || 0;

}

function readChemistry() {

  document.querySelectorAll(".chem-input").forEach(input => {

    const i =
      Number(input.dataset.chem);

    appData.chemistry[i] =
      input.value.trim();

  });

}

function updateTotal() {

  totalScore.textContent =
    (Number(attackScore.value) || 0) +
    (Number(midfieldScore.value) || 0) +
    (Number(defenceScore.value) || 0);

}

function saveAll() {

  readChemistry();
  readScores();
  persist();
  updateTotal();

  alert("Opstillingen er gemt.");

}

function persist() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(appData)
  );

}

function resetAll() {

  if (!confirm(
    "Vil du slette hele opstillingen, kemi og point?"
  )) return;

  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem("premierLeagueManager442V2");
  localStorage.removeItem("premierLeagueManager442");

  appData =
    createEmptyData();

  renderAll();
}

/* SPILLERKORT */

document.querySelectorAll(".player").forEach(card => {

  card.addEventListener("click", () => {

    openPlayer(
      Number(card.dataset.player)
    );

  });

});

/* KEMI */

document.querySelectorAll(".chem-input").forEach(input => {

  input.addEventListener("input", () => {

    input.value =
      input.value
      .replace(/[^0-9-]/g,"")
      .slice(0,2);

    readChemistry();
    persist();

  });

});

/* POINT */

document.querySelectorAll(".score-value").forEach(input => {

  input.addEventListener("input", () => {

    readScores();
    persist();
    updateTotal();

  });

});

/* LUK POPUP VED TRYK UDENFOR */

playerModal.addEventListener("click", event => {

  if (event.target === playerModal) {
    closeModal();
  }

});
