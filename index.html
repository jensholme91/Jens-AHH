<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier League Manager</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #071b35;
  color: white;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 20px 0 5px;
}

h2 {
  font-size: 16px;
  margin: 0 0 15px;
}

.pitch {
  position: relative;
  width: 94vw;
  max-width: 430px;
  height: 650px;
  margin: auto;
  background: #168447;
  border: 3px solid white;
  border-radius: 10px;
}

.player {
  position: absolute;
  transform: translate(-50%, -50%);
  background: white;
  color: #071b35;
  border-radius: 8px;
  padding: 10px 6px;
  width: 70px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>PREMIER LEAGUE MANAGER</h1>
<h2>4-4-2</h2>

<div class="pitch">

<div class="player" style="left:35%;top:15%">Spiller</div>
<div class="player" style="left:65%;top:15%">Spiller</div>

<div class="player" style="left:12%;top:40%">Spiller</div>
<div class="player" style="left:38%;top:40%">Spiller</div>
<div class="player" style="left:62%;top:40%">Spiller</div>
<div class="player" style="left:88%;top:40%">Spiller</div>

<div class="player" style="left:12%;top:67%">Spiller</div>
<div class="player" style="left:38%;top:67%">Spiller</div>
<div class="player" style="left:62%;top:67%">Spiller</div>
<div class="player" style="left:88%;top:67%">Spiller</div>

<div class="player" style="left:50%;top:88%">Målmand</div>

</div>

</body>
</html>
